name: Publish Python 🐍 distribution 📦 to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Pin HEAD commit date to the upstream release commit
        run: |
          git config user.email "pypa-dev@googlegroups.com"
          git config user.name "pip"
          GIT_COMMITTER_DATE="@1739120130 +0100" git commit --amend --no-edit --date="@1739120130 +0100"
      - name: Build a binary wheel and a source tarball
        run: ./build-project.py
      - name: Store the distribution packages
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: python-package-distributions
          path: dist/
