name: CI

on:
  workflow_dispatch:
    # allow manual runs on branches without a PR
    inputs:
      test-filter:
        description: "Optional pytest -k expression; empty runs the full suite"
        required: false
        default: ""

env:
  # The "FORCE_COLOR" variable, when set to 1,
  # tells Nox to colorize itself.
  FORCE_COLOR: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Resolve the outer pip installs (nox, the test requirements and the
      # tests/data/common_wheels setuptools/wheel fixtures) against the package
      # index as it existed on pip 25.0.1's release date, so the suite runs
      # against the same tooling upstream CI used instead of today's. This goes
      # in pip's *user config file* rather than PIP_INDEX_URL, because the env
      # var is inherited by the pip-under-test that pip's own functional tests
      # spawn, while tests/conftest.py redirects HOME/XDG_CONFIG_HOME per test
      # so the config file is not.
      - name: Pin the toolchain index to the release date
        run: |
          mkdir -p "$HOME/.config/pip"
          printf '[global]\nindex-url = https://:2025-02-09@time-machines-pypi.sealsecurity.io/\n' > "$HOME/.config/pip/pip.conf"
      - run: pip install nox
      - run: nox -s docs

  determine-changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      vendoring: ${{ steps.filter.outputs.vendoring }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vendoring:
              # Anything that's touching "vendored code"
              - "src/pip/_vendor/**"
              - "pyproject.toml"
              - "noxfile.py"
            tests:
              # Anything that's touching code-related stuff
              - ".github/workflows/ci.yml"
              - "src/**"
              - "tests/**"
              - "noxfile.py"
              # The test suite should also run when cutting a release
              # (which is the only time this file is modified).
              - "NEWS.rst"
        if: github.event_name == 'pull_request'

  packaging:
    name: packaging
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up git credentials
        run: |
          git config --global user.email "pypa-dev@googlegroups.com"
          git config --global user.name "pip"

      # Resolve the outer pip installs (nox, the test requirements and the
      # tests/data/common_wheels setuptools/wheel fixtures) against the package
      # index as it existed on pip 25.0.1's release date, so the suite runs
      # against the same tooling upstream CI used instead of today's. This goes
      # in pip's *user config file* rather than PIP_INDEX_URL, because the env
      # var is inherited by the pip-under-test that pip's own functional tests
      # spawn, while tests/conftest.py redirects HOME/XDG_CONFIG_HOME per test
      # so the config file is not.
      - name: Pin the toolchain index to the release date
        run: |
          mkdir -p "$HOME/.config/pip"
          printf '[global]\nindex-url = https://:2025-02-09@time-machines-pypi.sealsecurity.io/\n' > "$HOME/.config/pip/pip.conf"

      - run: pip install nox
      - run: nox -s prepare-release -- 99.9
      - run: nox -s build-release -- 99.9
      - run: pipx run check-manifest

  vendoring:
    name: vendoring
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.vendoring == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # "3.x" was CPython 3.13 on pip 25.0.1's release date; the release-era
          # rpds-py/PyO3 0.23.3 the vendoring session resolves cannot build against 3.14.
          python-version: "3.13"

      # Resolve the outer pip installs (nox, the test requirements and the
      # tests/data/common_wheels setuptools/wheel fixtures) against the package
      # index as it existed on pip 25.0.1's release date, so the suite runs
      # against the same tooling upstream CI used instead of today's. This goes
      # in pip's *user config file* rather than PIP_INDEX_URL, because the env
      # var is inherited by the pip-under-test that pip's own functional tests
      # spawn, while tests/conftest.py redirects HOME/XDG_CONFIG_HOME per test
      # so the config file is not.
      - name: Pin the toolchain index to the release date
        run: |
          mkdir -p "$HOME/.config/pip"
          printf '[global]\nindex-url = https://:2025-02-09@time-machines-pypi.sealsecurity.io/\n' > "$HOME/.config/pip/pip.conf"

      - run: pip install nox
      - run: nox -s vendoring
      - run: git diff --exit-code

  tests-unix:
    name: tests / ${{ matrix.python.key || matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    needs: [packaging, determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        # Upstream paired an x64 macOS (macos-13) with an arm64 one, but the
        # macos-13 label is retired and both surviving macOS labels are arm64,
        # so two entries ran the identical suite twice. macOS coverage stays
        # via macos-latest.
        os: [ubuntu-22.04, macos-latest]
        python:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        # macOS tests are expensively slow and a fork's macOS runner pool is
        # small, so the legs queue in waves instead of running concurrently.
        # Only test the oldest and newest Python supported by pip on macOS,
        # mirroring what upstream already does for its Windows matrix above.
        exclude:
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install bzr

      - name: Install MacOS dependencies
        if: runner.os == 'macOS'
        run: |
          DEPS=breezy
          if ! which svn; then
            DEPS="${DEPS} subversion"
          fi
          brew install ${DEPS}

      # Resolve the outer pip installs (nox, the test requirements and the
      # tests/data/common_wheels setuptools/wheel fixtures) against the package
      # index as it existed on pip 25.0.1's release date, so the suite runs
      # against the same tooling upstream CI used instead of today's. This goes
      # in pip's *user config file* rather than PIP_INDEX_URL, because the env
      # var is inherited by the pip-under-test that pip's own functional tests
      # spawn, while tests/conftest.py redirects HOME/XDG_CONFIG_HOME per test
      # so the config file is not.
      - name: Pin the toolchain index to the release date
        run: |
          mkdir -p "$HOME/.config/pip"
          printf '[global]\nindex-url = https://:2025-02-09@time-machines-pypi.sealsecurity.io/\n' > "$HOME/.config/pip/pip.conf"

      - run: pip install nox

      # Main check
      - name: Run unit tests
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} --
          tests/unit
          --verbose --numprocesses auto --showlocals
          ${{ inputs.test-filter && format('-k "{0}"', inputs.test-filter) || '' }}
      - name: Run integration tests
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} --no-install --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=5
          ${{ inputs.test-filter && format('-k "{0}"', inputs.test-filter) || '' }}

  tests-windows:
    name: tests / ${{ matrix.python }} / ${{ matrix.os }} / ${{ matrix.group.number }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 50

    needs: [packaging, determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [Windows]
        python:
          - "3.8"
          # Commented out, since Windows tests are expensively slow,
          # only test the oldest and newest Python supported by pip
          # - "3.9"
          # - "3.10"
          # - "3.11"
          # - "3.12"
          - "3.13"
        group:
          - { number: 1, pytest-filter: "not test_install" }
          - { number: 2, pytest-filter: "test_install" }

    steps:
      # The D: drive is significantly faster than the system C: drive.
      # https://github.com/actions/runner-images/issues/8755
      - name: Set TEMP to D:/Temp
        run: |
          mkdir "D:\\Temp"
          echo "TEMP=D:\\Temp" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # Resolve the outer pip installs (nox, the test requirements and the
      # tests/data/common_wheels setuptools/wheel fixtures) against the package
      # index as it existed on pip 25.0.1's release date, so the suite runs
      # against the same tooling upstream CI used instead of today's. This goes
      # in pip's *user config file* rather than PIP_INDEX_URL, because the env
      # var is inherited by the pip-under-test that pip's own functional tests
      # spawn, while tests/conftest.py redirects HOME/XDG_CONFIG_HOME per test
      # so the config file is not.
      - name: Pin the toolchain index to the release date
        run: |
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\pip" | Out-Null
          Set-Content -Path "$env:APPDATA\pip\pip.ini" -Value @(
            "[global]",
            "index-url = https://:2025-02-09@time-machines-pypi.sealsecurity.io/"
          )

      - run: pip install nox

      # Main check
      - name: Run unit tests (group 1)
        if: matrix.group.number == 1
        run: >-
          nox -s test-${{ matrix.python }} --
          tests/unit
          --verbose --numprocesses auto --showlocals
          ${{ inputs.test-filter && format('-k "{0}"', inputs.test-filter) || '' }}

      - name: Run integration tests (group ${{ matrix.group.number }})
        run: >-
          nox -s test-${{ matrix.python }} --no-install --
          tests/functional -k "(${{ matrix.group.pytest-filter }})${{ inputs.test-filter && format(' and ({0})', inputs.test-filter) || '' }}"
          --verbose --numprocesses auto --showlocals

  tests-zipapp:
    name: tests / zipapp
    # The macos-latest (M1) runners are the fastest available on GHA, even
    # beating out the ubuntu-latest runners. The zipapp tests are slow by
    # nature, and we don't care where they run, so we pick the fastest one.
    runs-on: macos-latest
    timeout-minutes: 50

    needs: [packaging, determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MacOS dependencies
        run: brew install breezy subversion

      # Resolve the outer pip installs (nox, the test requirements and the
      # tests/data/common_wheels setuptools/wheel fixtures) against the package
      # index as it existed on pip 25.0.1's release date, so the suite runs
      # against the same tooling upstream CI used instead of today's. This goes
      # in pip's *user config file* rather than PIP_INDEX_URL, because the env
      # var is inherited by the pip-under-test that pip's own functional tests
      # spawn, while tests/conftest.py redirects HOME/XDG_CONFIG_HOME per test
      # so the config file is not.
      - name: Pin the toolchain index to the release date
        run: |
          mkdir -p "$HOME/.config/pip"
          printf '[global]\nindex-url = https://:2025-02-09@time-machines-pypi.sealsecurity.io/\n' > "$HOME/.config/pip/pip.conf"

      - run: pip install nox

      # Main check
      - name: Run integration tests
        run: >-
          nox -s test-3.10 --
          tests/functional
          --verbose --numprocesses auto --showlocals
          --durations=5
          --use-zipapp
          ${{ inputs.test-filter && format('-k "{0}"', inputs.test-filter) || '' }}

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - determine-changes
      - docs
      - packaging
      - tests-unix
      - tests-windows
      - tests-zipapp
      - vendoring

    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: >-
            ${{
              (
                needs.determine-changes.outputs.vendoring != 'true'
                && github.event_name == 'pull_request'
              )
              && 'vendoring'
              || ''
            }}
            ,
            ${{
              (
                needs.determine-changes.outputs.tests != 'true'
                && github.event_name == 'pull_request'
              )
              && '
                tests-unix,
                tests-windows,
                tests-zipapp,
                tests-importlib-metadata,
              '
              || ''
            }}
          jobs: ${{ toJSON(needs) }}
